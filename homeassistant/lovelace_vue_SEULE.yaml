# Vue « Pronostics PMU » — forme POUR L'ÉDITEUR D'UNE SEULE VUE.
#
# À utiliser dans : ⋮ (en haut à droite) → Modifier → clique le crayon
# de l'onglet → ⋮ → « Modifier en YAML », dialogue « Configuration de
# la vue ».
#
# ⚠️ Efface TOUT le contenu de l'éditeur avant de coller ceci.
#
# Si tu passes au contraire par l'éditeur brut du tableau de bord
# entier (celui qui montre « views: »), utilise l'autre fichier,
# lovelace_vue_pronostics.yaml, qui commence par un tiret.
#
# ───────────────────────────────────────────────────────────────────
# POURQUOI L'IFRAME ÉTAIT VIDE, ET COMMENT C'EST RÉGLÉ
#
# « Impossible de charger les iframes pointant vers des sites web
# utilisant http: si Home Assistant est servi via https: ». Ton Home
# Assistant est en HTTPS, l'API en HTTP : le navigateur refuse le
# contenu mixte. Servir l'API en HTTPS avec un certificat auto-signé ne
# réglerait rien — une iframe refuse aussi un certificat non reconnu,
# et sans message cette fois.
#
# La page n'est donc plus chargée depuis l'API. C'est Home Assistant
# qui va la chercher LUI-MÊME, côté serveur, et la dépose dans son
# dossier `www`. Elle est ensuite servie sur /local/pmu/vue.html —
# même origine que Home Assistant, donc en HTTPS. Aucun contenu mixte,
# aucun certificat, et ça marche aussi en 4G par Nabu Casa.
#
# DEUX CHOSES À FAIRE AVANT DE COLLER CETTE VUE :
#
#   1. Paramètres → Appareils et services → Ajouter une intégration →
#      « Downloader » → dossier de téléchargement : www
#
#   2. Recharger le package pmu.yaml (il contient l'automation
#      « 🐎 PMU — rapatrier la page visuelle »), puis la lancer une
#      fois à la main : Paramètres → Automatisations → ⋮ → Exécuter.
#
# Tant que ces deux étapes ne sont pas faites, le cadre affichera une
# erreur 404 : c'est normal, le fichier n'existe pas encore.

type: sections
max_columns: 3
dense_section_placement: true
title: Pronostics
path: pronostics
icon: mdi:horse-variant

sections:

  # ═══ La page riche, sur toute la largeur ══════════════════════════
  - type: grid
    column_span: 3
    cards:

      - type: heading
        heading: Pronostics du jour
        heading_style: title
        icon: mdi:horse-variant

      - type: iframe
        # Chemin RELATIF, servi par Home Assistant lui-même : c'est
        # tout l'intérêt. Ne pas remettre une URL http:// ici, le
        # navigateur la rejetterait à nouveau.
        url: /local/pmu/vue.html
        # 100 % = carré. Au-delà, la page est plus haute que large :
        # il faut de la place pour déplier une justification.
        aspect_ratio: 130%

  # ═══ Colonne 1 — état de la pile ══════════════════════════════════
  - type: grid
    column_span: 1
    cards:

      - type: heading
        heading: État
        heading_style: subtitle
        icon: mdi:gauge

      - type: tile
        entity: sensor.pmu_courses
        name: Courses
        icon: mdi:calendar-today
        grid_options: {columns: 6}
      - type: tile
        entity: sensor.pmu_confiance
        name: Confiance
        icon: mdi:gauge
        grid_options: {columns: 6}
      - type: tile
        entity: sensor.pmu_favori_proba
        name: Favori
        icon: mdi:trophy-outline
        grid_options: {columns: 6}
      - type: tile
        entity: sensor.pmu_age_calcul
        name: Calculé il y a
        icon: mdi:update
        grid_options: {columns: 6}

      # ── Première collecte en cours ──────────────────────────────
      # Sans cette carte, la vue resterait vide une à deux heures au
      # premier démarrage, et un écran vide ressemble à une panne.
      - type: conditional
        conditions:
          - condition: state
            entity: sensor.pmu_courses
            state: "0"
        card:
          type: markdown
          content: >-
            {%- set ns = namespace(l=[]) -%}
            {%- if state_attr('sensor.pmu_courses', 'amorcage') -%}
            {%- set ns.l = ["## ⏳ Première collecte en cours", "",
                state_attr('sensor.pmu_courses', 'message') | default("", true), "",
                "Rien à faire : la vue se remplira toute seule."] -%}
            {%- else -%}
            {%- set ns.l = ["## Aucune course aujourd'hui", "",
                "Soit le programme du jour est vide, soit la collecte n'a pas encore tourné ce matin."] -%}
            {%- endif -%}
            {{ ns.l | join('\n') }}

      # ── Alerte si la pile ne répond plus ────────────────────────
      # binary_sensor.pmu_frais est en device_class « problem » :
      # 'on' = problème = pronostic périmé ou pile arrêtée.
      - type: conditional
        conditions:
          - condition: state
            entity: binary_sensor.pmu_frais
            state: "on"
        card:
          type: markdown
          content: >-
            {%- set ns = namespace(l=["## ⚠️ Pronostics périmés", "",
                "Le dernier calcul remonte à **" ~ states('sensor.pmu_age_calcul') ~ " h**.", "",
                "La pile Docker est probablement arrêtée, ou la collecte échoue.",
                "Regarder les journaux du conteneur `pmu-collecteur` dans Portainer."]) -%}
            {{ ns.l | join('\n') }}

      # ── Prochaine course, en texte ──────────────────────────────
      # Doublon volontaire de la page : c'est ce qui reste lisible sur
      # un téléphone en 4G, où l'iframe HTTP est bloquée.
      - type: markdown
        content: >-
          {%- macro joli(t) -%}{{ t | default('', true) | lower | title
            | replace(' Du ', ' du ') | replace(' De ', ' de ') | replace(' Des ', ' des ')
            | replace(' Le ', ' le ') | replace(' La ', ' la ') | replace(' Les ', ' les ')
            | replace(' Et ', ' et ') | replace(' Au ', ' au ') | replace(' Aux ', ' aux ')
            | replace(" D'", " d'") | replace(" L'", " l'") }}{%- endmacro -%}
          {%- macro lieu(t) -%}{{ joli(t | default('', true)
            | replace('HIPPODROME DE ', '') | replace("HIPPODROME D'", '')
            | replace('HIPPODROME ', '')) }}{%- endmacro -%}
          {%- set p = state_attr('sensor.pmu_courses', 'prochaine') -%}
          {%- set lib = {"ATTELE": "Attelé", "MONTE": "Monté", "PLAT": "Plat",
                         "HAIES": "Haies", "STEEPLECHASE": "Steeple", "CROSS": "Cross"} -%}
          {%- set ns = namespace(l=[]) -%}
          {%- if p -%}
          {%- set heure = (p.depart | as_datetime | as_local).strftime('%H:%M') if p.depart else "—" -%}
          {%- set sel = p.selection | default([], true) -%}
          {%- set nb = p.partants if p.partants else (sel | length) -%}
          {%- set a_cote = (sel | selectattr('cote') | list | length) > 0 -%}
          {%- set ns.l = ["### " ~ p.code ~ " · " ~ lieu(p.hippodrome), "",
              "**" ~ (p.libelle | default("", true) | lower | capitalize) ~ "**", "",
              lib.get(p.discipline, p.discipline | default("", true)) ~ " · "
                ~ p.distance ~ " m · " ~ nb ~ " partants · départ **" ~ heure ~ "**", ""] -%}
          {%- if a_cote -%}
          {%- set ns.l = ns.l + ["| N° | Cheval | Chance | Cote | Valeur |",
                                 "|---:|:-------|:-------|-----:|-------:|"] -%}
          {%- else -%}
          {%- set ns.l = ns.l + ["| N° | Cheval | Chance |",
                                 "|---:|:-------|:-------|"] -%}
          {%- endif -%}
          {%- for c in sel[:8] -%}
          {%- set pc = (c.proba | float(0)) * 100 -%}
          {%- set n = [((c.proba | float(0)) * 20) | round | int, 10] | min -%}
          {%- set barre = "`" ~ ("█" * n) ~ ("░" * (10 - n)) ~ "`" -%}
          {%- set nom = joli(c.cheval | default("?", true)) -%}
          {%- set nom = ("**" ~ nom ~ "**") if loop.first else nom -%}
          {%- set v = c.valeur -%}
          {%- set val = "—" if v is none else (("**+" ~ ((v | float(0)) * 100) | round | int ~ " %**")
                if (v | float(0)) > 0.15 else (((v | float(0)) * 100) | round | int ~ " %")) -%}
          {%- set base = "| " ~ c.num ~ " | " ~ nom ~ " | " ~ barre ~ " " ~ pc | round(1) ~ " %" -%}
          {%- set ns.l = ns.l + [base ~ (" | " ~ (c.cote if c.cote else "—") ~ " | " ~ val ~ " |")
                if a_cote else (base ~ " |")] -%}
          {%- endfor -%}
          {%- set premier = sel[0] if sel else none -%}
          {#- `premier.motifs` lèverait UndefinedError tant que le
              message MQTT retenu date d'avant la version 0.6, où les
              motifs n'existaient pas. `.get()` renvoie une liste vide
              au lieu de casser toute la carte. -#}
          {%- set motifs = premier.get('motifs') if premier else [] -%}
          {%- if motifs -%}
          {%- set ns.l = ns.l + ["", "**Pourquoi " ~ joli(premier.cheval) ~ " :**"] -%}
          {%- for m in motifs[:3] -%}
          {%- set ns.l = ns.l + ["- " ~ ("▲" if m.get('sens') == "+" else "▼")
              ~ " **" ~ m.get('titre', '') ~ "** — "
              ~ ((m.get('details') or [])[:2] | join(" · "))] -%}
          {%- endfor -%}
          {%- endif -%}
          {%- set ec = p.confiance | float(0) -%}
          {%- set niveau = "élevée" if ec > 0.10 else ("moyenne" if ec > 0.05 else "faible") -%}
          {%- set ns.l = ns.l + ["",
              "*Écart 1ᵉʳ / 2ᵉ choix : " ~ (ec * 100) | round(1)
              ~ " points — confiance " ~ niveau ~ ".*"] -%}
          {%- else -%}
          {%- set ns.l = ["### Plus de course aujourd'hui", "",
              "Le programme est terminé, ou la collecte n'a pas encore tourné."] -%}
          {%- endif -%}
          {{ ns.l | join('\n') }}

  # ═══ Colonnes 2-3 — le programme, en texte ════════════════════════
  - type: grid
    column_span: 2
    cards:
      - type: markdown
        text_only: true
        content: >-
          {%- macro joli(t) -%}{{ t | default('', true) | lower | title
            | replace(' Du ', ' du ') | replace(' De ', ' de ') | replace(' Des ', ' des ')
            | replace(' Le ', ' le ') | replace(' La ', ' la ') | replace(' Les ', ' les ')
            | replace(' Et ', ' et ') | replace(' Au ', ' au ') | replace(' Aux ', ' aux ')
            | replace(" D'", " d'") | replace(" L'", " l'") }}{%- endmacro -%}
          {%- macro lieu(t) -%}{{ joli(t | default('', true)
            | replace('HIPPODROME DE ', '') | replace("HIPPODROME D'", '')
            | replace('HIPPODROME ', '')) }}{%- endmacro -%}
          {%- set jour = state_attr('sensor.pmu_courses', 'date') -%}
          {%- set prog = state_attr('sensor.pmu_courses', 'programme') or [] -%}
          {%- set total = states('sensor.pmu_courses') -%}
          {%- set faites = prog | selectattr('arrivee_connue') | list | length -%}
          {#- Quatre colonnes, pas six. À six, la dernière sortait de
              l'écran dans une colonne de tableau de bord : l'état de la
              course et la confiance rejoignent donc la cellule du
              favori, où ils tiennent sans rien coûter. -#}
          {%- set ns = namespace(l=[
              "## Programme du " ~ ((jour | as_datetime).strftime('%d/%m') if jour else "—"), "",
              total ~ " courses aujourd'hui · " ~ (prog | length) ~ " détaillées ici · "
                ~ faites ~ " déjà courues", "",
              "| Course | Départ | Hippodrome | Favori du modèle |",
              "|:-------|-------:|:-----------|:-----------------|"]) -%}
          {%- for c in prog -%}
          {%- set top = c.selection[0] if c.selection else none -%}
          {%- set etat = "" if not top else ("🕐" if not c.arrivee_connue
                else ("✅" if top.arrivee == 1 else "✖️")) -%}
          {%- set ec = c.confiance | float(0) -%}
          {%- set pts = "●●●" if ec > 0.10 else ("●●" if ec > 0.05 else "●") -%}
          {%- set choix = "—" if not top else (etat ~ " **" ~ top.num ~ "** "
                ~ joli(top.cheval | default("?", true))
                ~ " · " ~ ((top.proba | float(0)) * 100) | round | int ~ " % " ~ pts) -%}
          {%- set ns.l = ns.l + ["| **" ~ c.code ~ "** | "
              ~ ((c.depart | as_datetime | as_local).strftime('%H:%M') if c.depart else "—")
              ~ " | " ~ lieu(c.hippodrome) ~ " | " ~ choix ~ " |"] -%}
          {%- endfor -%}
          {%- set ns.l = ns.l + ["",
              "*✅ le favori du modèle a gagné · ✖️ non · 🕐 course à venir."
              ~ " Les points donnent l'écart entre le 1ᵉʳ et le 2ᵉ choix :"
              ~ " ●●● course tranchée, ● course ouverte."
              ~ " Le programme complet est dans le cadre du haut ;"
              ~ " ce tableau n'en montre que les premières courses.*"] -%}
          {{ ns.l | join('\n') }}

  # ═══ Bas de page — lecture et diagnostics ═════════════════════════
  - type: grid
    column_span: 3
    cards:

      - type: heading
        heading: Comprendre et vérifier
        heading_style: subtitle
        icon: mdi:information-outline

      - type: markdown
        text_only: true
        grid_options: {columns: 6}
        content: >-
          {%- set ns = namespace(l=["### Lecture", "",
              "Les probabilités sont **calibrées** : quand le modèle annonce 20 %,"
              ~ " l'événement arrive environ une fois sur cinq.", "",
              "La colonne **Valeur** vaut `probabilité × cote − 1`. Positive, elle"
              ~ " signale un écart avec le marché — pas un pari gagnant. Le PMU est"
              ~ " un pari mutuel : le prélèvement est retiré avant répartition, donc"
              ~ " un écart doit dépasser ce prélèvement pour valoir quelque chose,"
              ~ " et se vérifier sur plusieurs centaines de courses.", "",
              "Les **motifs** de la page indiquent ce qui a pesé sur la note"
              ~ " dans ce lot précis. Ce sont des associations mesurées, pas des"
              ~ " causes : le modèle constate que les chevaux à ce profil gagnent"
              ~ " plus souvent, il n'explique pas pourquoi."]) -%}
          {{ ns.l | join('\n') }}

      - type: entities
        title: Pile PMU
        show_header_toggle: false
        grid_options: {columns: 6}
        entities:
          - entity: binary_sensor.pmu_frais
            name: État des pronostics
          - entity: sensor.pmu_courses
            name: Courses du jour
          - entity: sensor.pmu_prochaine
            name: Prochaine course
          - entity: sensor.pmu_prochaine_depart
            name: Départ
          - entity: sensor.pmu_favori
            name: Favori du modèle
          - entity: sensor.pmu_age_calcul
            name: Âge du calcul
      - type: markdown
        text_only: true
        content: >-
          [Ouvrir la page en plein écran](/local/pmu/vue.html)
          — même page, sans le cadre.

          Si elle affiche une erreur 404, c'est que le fichier n'a pas
          encore été rapatrié : vérifier que l'intégration **Downloader**
          est installée avec `www` comme dossier de téléchargement, puis
          exécuter l'automatisation *🐎 PMU — rapatrier la page visuelle*.
